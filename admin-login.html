<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login | Dream Cart BD</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100" style="background: radial-gradient(circle at top, #1e293b 0%, #090d16 100%);">
  <div class="card bg-card border-secondary p-4 p-md-5 rounded-4 shadow-lg text-center" style="max-width: 440px; width: 90%;">
    <div class="navbar-brand-logo mx-auto mb-3" style="width: 54px; height: 54px; font-size: 26px;">DC</div>
    <h4 class="fw-bold mb-1 text-light">Dream Cart BD</h4>
    <p class="text-muted small mb-4">Enterprise Admin & Staff Control Center</p>

    <form onsubmit="handleAdminLogin(event)">
      <div class="mb-3 text-start">
        <label class="form-label small text-muted">Admin User ID / Email</label>
        <input type="text" id="adminUser" class="form-control bg-secondary text-light border-secondary" required placeholder="admin@dreamcartbd.com" value="jainal.dcitbd@gmail.com">
      </div>
      <div class="mb-3 text-start">
        <label class="form-label small text-muted">Password</label>
        <div class="input-group">
          <input type="password" id="adminPass" class="form-control bg-secondary text-light border-secondary" required placeholder="••••••••" value="Admin@DreamCart2026">
          <button type="button" class="btn btn-outline-secondary" onclick="togglePass()"><i class="bi bi-eye"></i></button>
        </div>
      </div>
      <div class="mb-4 text-start">
        <label class="form-label small text-muted">Security Challenge: <strong class="text-warning">9 + 6 = ?</strong></label>
        <input type="number" id="adminCaptcha" class="form-control bg-secondary text-light border-secondary" required placeholder="Enter result" value="15">
      </div>
      <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold">Authenticate & Enter</button>
      <div class="text-muted small mt-3">Protected by Short-Lived Token & Server Verification</div>
    </form>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
  function togglePass() {
    const input = document.getElementById("adminPass");
    input.type = input.type === "password" ? "text" : "password";
  }
  function handleAdminLogin(e) {
    e.preventDefault();
    if (parseInt(document.getElementById("adminCaptcha").value) !== 15) {
      alert("Invalid Security Captcha challenge!");
      return;
    }
    const adminUser = {
      id: "ADM001",
      name: "Jainal Abedin (Super Admin)",
      email: document.getElementById("adminUser").value,
      role: "super_admin",
      token: "tok_admin_" + Date.now()
    };
    api.setCurrentUser(adminUser, true);
    window.location.href = "admin-dashboard.html";
  }
  </script>
</body>
</html>
